# ==============================================================================
# 🛡️ Ultra-Hardened AdGuard Home Master Configuration Template
# Project: adguardhome-tor-dns-fortress
# Author: jpscalero
# License: MIT
# ==============================================================================

schema_version: 35

http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: false
  # Fase 3: escucha solo en loopback. El panel tiene la contrasena del DNS de
  # toda la red; exponerlo en 0.0.0.0 lo publica a cualquiera de la LAN.
  # Si necesitas administrarlo desde otro equipo, usa un tunel SSH o un proxy
  # con TLS, no 0.0.0.0.
  address: 127.0.0.1:3000
  session_ttl: 24h

users:
  - name: admin
    # Replace with bcrypt hash generated during initial setup:
    password: __ADMIN_BCRYPT_PASSWORD_HASH__

auth_attempts: 3
block_auth_min: 30

# HTTP Proxy: Routes AdGuard Home management traffic (filter list downloads, version checks) through Tor:
http_proxy: socks5://127.0.0.1:9050
language: es
theme: dark

dns:
  # Explicit binding prevents conflicts with Windows services (SharedAccess / ICS):
  # To serve the LAN, uncomment the local IP line below (use the LAN IP of this computer):
  bind_hosts:
    - 127.0.0.1
    # - __YOUR_LOCAL_IP__
    - '::1'
  port: 53

  # Privacy & Anonymization Hardening:
  anonymize_client_ip: true
  ratelimit: 40
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist:
    - 127.0.0.1
    # Add trusted LAN client IPs here:
    # - __YOUR_LOCAL_IP__
  refuse_any: true

  # Resolutores DoH por IP fija, en paralelo.
  #
  # Por que por IP y no por nombre:
  #   - Con proxy, AdGuard Home resuelve el hostname del upstream con
  #     bootstrap_dns, que es DNS en claro: una fuga pequena pero real.
  #   - Con la IP en la URL no hay resolucion previa (los certificados de
  #     Quad9, Cloudflare y AdGuard DNS incluyen la IP como SAN).
  #
  # Por que el tunel va en http_proxy y no en el upstream:
  #   AdGuard Home NO admite la sintaxis "[https://host] socks5://..."; los
  #   corchetes son solo para upstreams por dominio ("[/ejemplo.local/]ipo").
  #   El trafico HTTP del cliente DoH si respeta http_proxy, y eso es lo que
  #   hace que el resolutor vea una salida de Tor y no tu IP real.
  #
  # Verificado en produccion con: --check-config, DNSSEC y salida Tor.
  upstream_dns:
    # Quad9 (Suiza, filtrado de malware, valida DNSSEC)
    - https://9.9.9.9/dns-query
    - https://149.112.112.112/dns-query
    # Cloudflare (sin filtrado)
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    # AdGuard DNS (filtrado)
    - https://94.140.14.14/dns-query
    # Resolutor nativo de Tor para .onion (IP virtual, no sale de Tor)
    - '[/onion/]127.0.0.1:5350'
    #
    # Alternativas (conviertelas a su IP si las usas, por el motivo de arriba):
    # - https://dns.digitale-gesellschaft.ch/dns-query   # Suiza
    # - https://doh.applied-privacy.net/query            # Austria, GDPR
    # - https://base.dns.mullvad.net/dns-query           # Mullvad
    # - https://doh.dns.sb/dns-query                     # DNS.SB
    # - https://security.cloudflare-dns.com/dns-query    # 1.1.1.2

  upstream_dns_file: ""

  # Bootstrap DNS: Literal IPs only (prevents circular dependency resolving bootstrap hostnames over SOCKS5):
  bootstrap_dns:
    - 9.9.9.9
    - 1.1.1.2
    - 149.112.112.112
    - 1.0.0.1

  fallback_dns:
    - 9.9.9.9
    - 1.1.1.2
    - 149.112.112.112

  # Parallel Race Mode: queries all neutral resolvers concurrently, accepts fastest answer
  upstream_mode: parallel
  fastest_timeout: 1s

  allowed_clients: []
  disallowed_clients: []

  # Fingerprinting & Probe Protection:
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
    - version.server
    - authors.bind
    - localhost.bind
    - whoami.akamai.net
    - whoami.ultradns.net
    - porttest.dns-oarc.net

  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128

  # High-Speed RAM Optimistic Cache (32 MB, 100k+ entries):
  cache_enabled: true
  cache_size: 33554432
  cache_ttl_min: 300
  cache_ttl_max: 86400
  cache_optimistic: true
  cache_optimistic_answer_ttl: 60s
  cache_optimistic_max_age: 24h

  # ISP DNS Hijack Detection & Bogus NXDOMAIN Redirection:
  bogus_nxdomain:
    - 92.242.140.21
    - 92.242.132.16
    - 92.242.132.24
    - 212.166.190.241
    - 212.166.190.242
    - 80.58.61.250
    - 80.58.61.254
    - 62.36.225.150
    - 146.112.61.106
    - 8.15.7.117
    - 8.15.7.118
    - 63.251.179.17

  # Anti-Leak & Integrity Enforcements:
  aaaa_disabled: true
  enable_dnssec: true
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false

  max_goroutines: 300
  handle_ddr: true
  upstream_timeout: 5s
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
  blocked_response_ttl: 1800

# Local TLS (DoH, DoT, DoQ) - Optional: generate self-signed cert or Let's Encrypt
tls:
  enabled: false
  server_name: "adguard.home"
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  certificate_chain: ""
  private_key: ""
  certificate_path: ""
  private_key_path: ""
  strict_sni_check: false

# Amnesic Zero-Disk Querylog (Anti-Forensics: 1h retention, 500 items max in RAM only):
querylog:
  dir_path: ""
  ignored:
    - arpa
    - local
    - home
    - lan
    - 0.in-addr.arpa
    - 127.in-addr.arpa
    - 254.169.in-addr.arpa
    - 2.0.192.in-addr.arpa
    - 100.51.198.in-addr.arpa
    - 113.0.203.in-addr.arpa
    - 255.255.255.255.in-addr.arpa
  interval: 1h
  size_memory: 500
  enabled: true
  ignored_enabled: true
  file_enabled: false

statistics:
  dir_path: ""
  ignored: []
  interval: 7d
  enabled: true
  ignored_enabled: false

