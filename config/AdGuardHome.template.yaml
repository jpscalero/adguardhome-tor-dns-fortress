http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: false
  # Set to 127.0.0.1:80 for local only, or 0.0.0.0:80 to serve LAN clients:
  address: 0.0.0.0:80
  session_ttl: 24h

users:
  - name: admin
    # Replace with bcrypt hash generated during initial setup:
    password: __ADMIN_BCRYPT_PASSWORD_HASH__

auth_attempts: 3
block_auth_min: 30

# HTTP Proxy: Routes AdGuard Home management traffic (filter list downloads, version checks) through Tor:
http_proxy: socks5://127.0.0.1:9050
language: es
theme: dark

dns:
  # Explicit binding prevents conflicts with Windows services (SharedAccess / ICS):
  bind_hosts:
    - 127.0.0.1
    - '::1'
    # Add your local network interface IP here (e.g., 192.168.1.100) if serving LAN:
    # - __YOUR_LOCAL_IP__
  port: 53

  # Privacy & Anonymization Hardening:
  anonymize_client_ip: true
  ratelimit: 40
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist:
    - 127.0.0.1
    # Add trusted LAN client IPs here:
    # - __YOUR_LOCAL_IP__
  refuse_any: true

  # Multi-Jurisdiction Parallel DoH Resolvers (Routed explicitly through Tor SOCKS5 per upstream):
  # NOTE: In AdGuard Home (v0.107.20+), adding socks5:// to the upstream URI ensures that actual user
  # DNS query traffic travels encrypted through Tor, independent of http_proxy.
  upstream_dns:
    # Switzerland (Neutral, strict privacy laws)
    - '[https://dns.digitale-gesellschaft.ch/dns-query] socks5://127.0.0.1:9050'
    # Austria (Neutral EU, GDPR compliant)
    - '[https://doh.applied-privacy.net/query] socks5://127.0.0.1:9050'
    # Sweden (Mullvad zero-logs DoH)
    - '[https://base.dns.mullvad.net/dns-query] socks5://127.0.0.1:9050'
    # Germany (DNS.SB, uncensored & zero-logs)
    - '[https://doh.dns.sb/dns-query] socks5://127.0.0.1:9050'
    # Global Swiss Foundation (Quad9, malicious domain filtering)
    - '[https://dns.quad9.net/dns-query] socks5://127.0.0.1:9050'
    # Cloudflare Security (1.1.1.2 malware blocking)
    - '[https://security.cloudflare-dns.com/dns-query] socks5://127.0.0.1:9050'
    # Control D (Malware & tracker blocking)
    - '[https://freedns.controld.com/p2] socks5://127.0.0.1:9050'
    # Native Tor .onion resolver integration
    - '[/onion/]127.0.0.1:5350'

  upstream_dns_file: ""

  # Bootstrap DNS: Literal IPs only (prevents circular dependency resolving bootstrap hostnames over SOCKS5):
  bootstrap_dns:
    - 9.9.9.9
    - 1.1.1.2
    - 149.112.112.112
    - 1.0.0.1

  fallback_dns:
    - 9.9.9.9
    - 1.1.1.2
    - 149.112.112.112

  # Parallel Race Mode: queries all neutral resolvers concurrently, accepts fastest answer
  upstream_mode: parallel
  fastest_timeout: 1s

  allowed_clients: []
  disallowed_clients: []

  # Fingerprinting & Probe Protection:
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
    - version.server
    - authors.bind
    - localhost.bind
    - whoami.akamai.net
    - whoami.ultradns.net
    - porttest.dns-oarc.net

  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128

  # High-Speed RAM Optimistic Cache (32 MB, 100k+ entries):
  cache_enabled: true
  cache_size: 33554432
  cache_ttl_min: 300
  cache_ttl_max: 86400
  cache_optimistic: true
  cache_optimistic_answer_ttl: 60s
  cache_optimistic_max_age: 24h

  # ISP DNS Hijack Detection & Bogus NXDOMAIN Redirection:
  bogus_nxdomain:
    - 92.242.140.21
    - 92.242.132.16
    - 92.242.132.24
    - 212.166.190.241
    - 212.166.190.242
    - 80.58.61.250
    - 80.58.61.254
    - 62.36.225.150
    - 146.112.61.106
    - 8.15.7.117
    - 8.15.7.118
    - 63.251.179.17

  # Anti-Leak & Integrity Enforcements:
  aaaa_disabled: true
  enable_dnssec: true
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false

  max_goroutines: 300
  handle_ddr: true
  upstream_timeout: 5s
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
  blocked_response_ttl: 1800

# Local TLS (DoH, DoT, DoQ) - Optional: generate self-signed cert or Let's Encrypt
tls:
  enabled: false
  server_name: "adguard.home"
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  certificate_chain: ""
  private_key: ""
  certificate_path: ""
  private_key_path: ""
  strict_sni_check: false

# Amnesic Zero-Disk Querylog (Anti-Forensics: 1h retention, 500 items max in RAM only):
querylog:
  dir_path: ""
  ignored:
    - arpa
    - local
    - home
    - lan
    - 0.in-addr.arpa
    - 127.in-addr.arpa
    - 254.169.in-addr.arpa
    - 2.0.192.in-addr.arpa
    - 100.51.198.in-addr.arpa
    - 113.0.203.in-addr.arpa
    - 255.255.255.255.in-addr.arpa
  interval: 1h
  size_memory: 500
  enabled: true
  ignored_enabled: true
  file_enabled: false

statistics:
  dir_path: ""
  ignored: []
  interval: 7d
  enabled: true
  ignored_enabled: false

