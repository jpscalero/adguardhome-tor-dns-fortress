  - '||mask.icloud.com^$dnsrewrite=NXDOMAIN'
  - '||mask-h2.icloud.com^$dnsrewrite=NXDOMAIN'
  - '||wpad.*^$dnsrewrite=NXDOMAIN'
  - '||wpad^$dnsrewrite=NXDOMAIN'

  # ==========================================
  # BLOQUEO DE TLDS DE ALTO RIESGO (PHISHING Y MALWARE)
  # ==========================================
  - '||*.zip^$deny'
  - '||*.mov^$deny'
  - '||*.country^$deny'
  - '||*.kim^$deny'
  - '||*.science^$deny'
  - '||*.gdn^$deny'
  - '||*.click^$deny'
  - '||*.link^$deny'
  - '||*.work^$deny'
