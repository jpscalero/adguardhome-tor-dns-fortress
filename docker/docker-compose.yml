# ==============================================================================
# Perfil Docker (Linux): nucleo DNS+Tor de la fortaleza.
#
# Incluye:    AdGuard Home con DoH sobre Tor.
# No incluye: watchdog, failsafe, centinela AI, senuelo y GoodbyeDPI (Windows).
#
# Aislamiento: dentro de los contenedores se escucha en 0.0.0.0, pero los
# puertos publicados se mapean SOLO a 127.0.0.1 del host. Si se mapearan a
# 0.0.0.0:53 estarias sirviendo DNS a toda la red sin querer.
#
# Uso:
#   cd docker
#   docker compose up -d --build
#   -> panel: http://127.0.0.1:3000  (pide crear el administrador la 1a vez)
# ==============================================================================

services:
  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    image: fortress-tor:2.0.0
    container_name: fortress-tor
    restart: unless-stopped
    volumes:
      - tor-data:/var/lib/tor
    ports:
      - "127.0.0.1:9050:9050"
      - "127.0.0.1:5350:5350/udp"
    networks:
      - fortress
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: fortress-adguard
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    ports:
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:3000:3000/tcp"
    volumes:
      - agh-work:/opt/adguardhome/work
      - ./AdGuardHome.yaml:/opt/adguardhome/conf/AdGuardHome.yaml
    networks:
      - fortress
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  tor-data:
  agh-work:

networks:
  fortress:
    driver: bridge
