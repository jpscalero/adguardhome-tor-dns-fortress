name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Empaquetar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir paquete
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          mkdir -p dist
          # git archive empaqueta exactamente lo versionado: sin listas manuales
          # que se olviden de docker/ o .github/ (paso en v2.0.0).
          git archive --format=zip --prefix="fortress-${VER}/" -o "dist/fortress-${VER}.zip" HEAD
          ( cd dist && sha256sum "fortress-${VER}.zip" > SHA256SUMS )
          echo "--- contenido ---"
          cat dist/SHA256SUMS
          echo "--- resumen del zip ---"
          unzip -l "dist/fortress-${VER}.zip" | tail -3

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fortress-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          body_path: docs/RELEASE-NOTES.md
          fail_on_unmatched_files: true
